<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECRET 레시피 | 교사 질문·피드백 게시판</title>
<style>
:root{--navy:#24466f;--navy2:#325d8e;--green:#6f9887;--text:#24364b;--muted:#6f7f91;--line:#d9e4ef;--bg:#f7f9fc}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);background:linear-gradient(135deg,#f5f8fc,#f8fbf9)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}
.hero{padding:32px 34px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2) 65%,var(--green));box-shadow:0 12px 34px rgba(36,70,111,.12)}
.hero small{font-weight:900;letter-spacing:.08em}.hero h1{margin:8px 0 10px;font-size:clamp(28px,4vw,42px)}.hero p{margin:0;line-height:1.7}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.search{flex:1;min-width:250px;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 13px}
.search input{width:100%;border:0;outline:0;padding:12px 0;background:transparent}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;background:var(--navy);color:#fff}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.small{padding:8px 11px;font-size:13px}.btn.danger{background:#fff;color:#b44a4a;border:1px solid #eccfcf}
.count{font-size:14px;color:var(--muted);font-weight:800}
.composer{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 10px 26px rgba(36,70,111,.08)}.composer.open{display:block}
.composer h2{margin:0 0 14px;color:var(--navy)}
.grid{display:grid;grid-template-columns:180px 1fr;gap:12px}
.field{margin-top:12px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:850;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfdff;outline:none}.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.board{display:grid;gap:13px}
.post{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 22px rgba(36,70,111,.06)}
.post-head{display:flex;gap:12px;align-items:flex-start;padding:17px 18px;cursor:pointer}
.q{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--navy2);color:#fff;font-weight:950;flex:none}
.main{flex:1;min-width:0}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}.tag{font-size:11px;font-weight:900;color:var(--navy);background:#eaf2fb;padding:4px 8px;border-radius:999px}.author{font-size:12px;color:var(--muted);font-weight:800}
.title{margin:0;font-size:16px;line-height:1.45}
.status{font-size:11px;font-weight:900;padding:5px 9px;border-radius:999px;flex:none}.done{color:#477665;background:#eef6f2}.wait{color:#8b6a36;background:#fff5df}
.chev{padding-top:6px;color:#7e91a7;transition:.2s}.post.open .chev{transform:rotate(180deg)}
.detail{display:none;border-top:1px solid var(--line);padding:0 18px 18px;background:#fbfdff}.post.open .detail{display:block}
.question{margin:16px 0 13px;line-height:1.75;white-space:pre-wrap}
.answerbox{display:flex;gap:11px;align-items:flex-start;padding:15px;border-radius:15px;background:#eef6f2;border:1px solid #d9e9e2}
.a{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:950;flex:none}.answer{line-height:1.72;white-space:pre-wrap}
.noanswer{padding:14px;border-radius:14px;background:#fff8e8;border:1px solid #f0e2bc;color:#7d673c;font-size:14px;font-weight:750}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.editor{display:none;margin-top:12px;padding:14px;border:1px dashed #b9cbdc;border-radius:14px;background:#f9fbfd}.editor.open{display:block}.editor textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;resize:vertical}
.help{margin-top:18px;padding:14px 15px;border:1px solid #d5e2ef;border-radius:15px;background:#edf4fb;color:#4c627b;font-size:13px;line-height:1.65}
.footer{text-align:center;margin-top:24px;color:var(--muted);font-size:12px}
@media(max-width:700px){.wrap{padding:15px 12px 40px}.hero{padding:25px 21px}.grid{grid-template-columns:1fr}.post-head{padding:15px}.detail{padding:0 15px 15px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<small>SECRET RECIPE · 교사 지원</small>
<h1>교사 질문 · 피드백 게시판</h1>
<p>구글 스프레드시트와 연동되어 안전하게 저장되는 실시간 게시판입니다. 궁금한 점이나 개선 의견을 남겨주세요.</p>
</section>

<div class="toolbar">
<div class="search">🔎 <input id="search" placeholder="질문, 답변, 키워드 검색"></div>
<button class="btn" id="newBtn">+ 질문 작성</button>
<button class="btn secondary" id="loadBtn">새로고침</button>
<span class="count" id="count">데이터 불러오는 중...</span>
</div>

<section class="composer" id="composer">
<h2>새 질문 작성</h2>
<div class="grid">
<div class="field"><label>작성자</label><input id="author" placeholder="예: 3학년 교사"></div>
<div class="field"><label>분류</label><select id="category"><option>앱 사용</option><option>수업 적용</option><option>가정 연계</option><option>오류 문의</option><option>개선 제안</option><option>개인정보·안전</option><option>기타</option></select></div>
</div>
<div class="field"><label>질문 제목</label><input id="title" placeholder="궁금한 내용을 한 문장으로 적어주세요."></div>
<div class="field"><label>질문 내용</label><textarea id="question" placeholder="수업 상황이나 개선 의견을 구체적으로 적어주세요."></textarea></div>
<div class="form-actions"><button class="btn secondary" id="cancelBtn">취소</button><button class="btn green" id="saveBtn">질문 등록</button></div>
</section>

<main class="board" id="board"></main>

<div class="help"><b>사용 방법</b> · 질문 제목을 누르면 내용을 펼칠 수 있습니다. 구글 스프레드시트와 실시간 연동되어 모든 사용자가 같은 내용을 공유합니다.</div>
<div class="footer">SECRET 레시피 교사 지원 게시판 · 스프레드시트 연동형</div>
</div>

<script>
// ★ 여기에 위에서 복사한 구글 앱스크립트 웹 앱 URL을 넣으세요!
const API_URL = "https://script.google.com/macros/s/AKfycbyyScjYNPDSBiptT9KLh69baIDyxtyW-YqcV4dJqgS8E7_FJZRDoNPB1ASM4pIQZELd/exec";

let posts = [];
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

function fetchPosts(){
  if(API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
    $("count").textContent = "스프레드시트 URL을 입력해주세요!";
    $("board").innerHTML = `<div class="help">코드 상단의 API_URL에 구글 앱스크립트 웹 앱 주소를 입력해야 데이터가 연동됩니다.</div>`;
    return;
  }
  $("count").textContent = "데이터 불러오는 중...";
  fetch(API_URL, {method: "POST", body: JSON.stringify({action: "get"})})
    .then(res=>res.json())
    .then(data=>{
      posts = data.reverse();
      render();
    })
    .catch(err=>{
      $("count").textContent = "데이터 로드 실패";
      console.log(err);
    });
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const list = posts.map((p,i)=>({...p,i})).filter(p=>[p.author,p.category,p.title,p.question,p.answer].join(" ").toLowerCase().includes(q));
  $("count").textContent = `전체 ${posts.length}건 · 답변완료 ${posts.filter(p=>p.answer&&p.answer.trim()).length}건`;
  
  $("board").innerHTML = list.length ? list.map(p=>`
  <article class="post" data-i="${p.i}">
   <div class="post-head" onclick="toggle(${p.i})">
    <div class="q">Q</div>
    <div class="main"><div class="meta"><span class="tag">${esc(p.category)}</span><span class="author">${esc(p.author||"교사")}</span></div><h3 class="title">${esc(p.title)}</h3></div>
    <span class="status ${p.answer&&p.answer.trim()?"done":"wait"}">${p.answer&&p.answer.trim()?"답변완료":"답변대기"}</span><div class="chev">⌄</div>
   </div>
   <div class="detail">
    <div class="question">${esc(p.question)}</div>
    ${p.answer&&p.answer.trim()?`<div class="answerbox"><div class="a">A</div><div class="answer">${esc(p.answer)}</div></div>`:`<div class="noanswer">아직 등록된 답변이 없습니다.</div>`}
    <div class="actions"><button class="btn secondary small" onclick="event.stopPropagation();openEditor(${p.i})">답변 작성/수정</button></div>
    <div class="editor" id="ed-${p.i}"><textarea id="ans-${p.i}" placeholder="답변 내용을 입력하세요.">${esc(p.answer||"")}</textarea><div class="form-actions"><button class="btn secondary small" onclick="closeEditor(${p.i})">취소</button><button class="btn green small" onclick="saveAnswer(${p.i})">답변 저장</button></div></div>
   </div>
  </article>`).join("") : `<div class="help">검색 결과가 없습니다.</div>`;
}

function toggle(i){document.querySelector(`.post[data-i="${i}"]`)?.classList.toggle("open")}
function openEditor(i){document.querySelector(`.post[data-i="${i}"]`)?.classList.add("open");$("ed-"+i)?.classList.add("open");$("ans-"+i)?.focus()}
function closeEditor(i){$("ed-"+i)?.classList.remove("open")}

function saveAnswer(i){
  const p = posts[i];
  const newAns = $("ans-"+i).value.trim();
  p.answer = newAns;
  
  $("count").textContent = "답변 저장 중...";
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({action: "answer", title: p.title, question: p.question, answer: newAns})
  }).then(res=>res.json()).then(res=>{
    alert("답변이 저장되었습니다!");
    fetchPosts();
  });
}

$("newBtn").onclick = ()=>$("composer").classList.add("open");
$("cancelBtn").onclick = ()=>$("composer").classList.remove("open");
$("loadBtn").onclick = fetchPosts;

$("saveBtn").onclick = ()=>{
  const title = $("title").value.trim(), question = $("question").value.trim();
  if(!title || !question){ alert("질문 제목과 내용을 입력해주세요."); return; }
  
  const newPost = {
    author: $("author").value.trim() || "교사",
    category: $("category").value,
    title: title,
    question: question
  };
  
  $("count").textContent = "질문 등록 중...";
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({action: "add", ...newPost})
  }).then(res=>res.json()).then(res=>{
    alert("질문이 등록되었습니다!");
    $("author").value = ""; $("title").value = ""; $("question").value = "";
    $("composer").classList.remove("open");
    fetchPosts();
  });
};

$("search").oninput = render;
fetchPosts();
</script>
</body>
</html>
